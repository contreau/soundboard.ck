<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" viewport-fit="cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="title" content="Soundboard.CK" />
    <meta property="og:title" content="Soundboard.CK" />
    <meta name="description" content="A CK-ahh soundboard." />
    <meta property="og:description" content="A CK-ahh soundboard." />
    <meta name="keywords" content="soundboard, funny, meme" />
    <meta property="og:url" content="https://contreau.github.io/soundboard.ck/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon/apple-touch-icon.png" />
    <meta name="language" content="English" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Soundboard.CK</title>
    <style>
      @import "98.css";

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        touch-action: manipulation;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background-color: #63708a;
        background: url("/sunset.jpg");
        color: #000000;
        font-family: Arial;
        min-height: 100dvh;
        align-content: center;
      }

      main {
        padding-inline: 1em;
        padding-block: 1em;
        max-width: 400px;
        margin-inline: auto;
      }

      button,
      label {
        font-size: 11.5px;
        touch-action: manipulation;
      }

      div.window-body {
        max-width: fit-content;
        margin-inline: auto;
      }

      ul#button-grid {
        display: grid;
        column-gap: 1rem;
        row-gap: 1rem;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding-left: 0;
        margin-block: 0.75rem;

        li {
          list-style-type: none;
        }

        button {
          min-width: 120px;
        }

        button#stop {
          min-width: fit-content;
          display: block;
          svg {
            vertical-align: -1.5px;
          }
        }
      }

      li:has(button#stop) {
        justify-self: center;
      }

      div.window {
        padding: 2px;
      }

      div.title-bar {
        background: linear-gradient(20deg, #ffcd00, #000, #ce1126);
      }

      div.title-bar-text svg {
        display: inline;
        width: 15px;
        height: 15px;
        vertical-align: -3px;
      }

      .config {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-inline: auto;
        margin-top: 1.25rem;
        margin-bottom: 0.75rem;
      }

      div.field-border-disabled {
        padding: 1em;
      }

      @media (hover) {
        button,
        button#stop,
        label[for="stack"] {
          cursor: pointer;
        }
      }

      @media (max-width: 300px) {
        #button-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 500px) {
        body {
          background-position: center;
        }
        main {
          max-width: 325px;
        }
      }

      @media (min-width: 1530px) {
        body {
          background-size: 100%;
        }
      }
    </style>

    <script src="src/index.ts" type="module"></script>
  </head>
  <body>
    <main>
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M11 22H9v-2H7v-2h2V6H7V4h2V2h2v20Zm8 0h-6v-2h6v2Zm2-2h-2v-2h2v2ZM7 18H5v-2h2v2Zm10 0h-4v-2h4v2Zm6 0h-2V6h2v12ZM5 10H3v4h2v2H1V8h4v2Zm14 6h-2V8h2v8Zm-4-2h-2v-4h2v4ZM7 8H5V6h2v2Zm10 0h-4V6h4v2Zm4-2h-2V4h2v2Zm-2-2h-6V2h6v2Z"
              />
            </svg>
            Soundboard.CK
          </div>
        </div>
        <div class="window-body">
          <ul id="button-grid">
            <li>
              <div class="field-border-disabled">
                <input type="checkbox" id="stack" />
                <label for="stack">Stack Sounds</label>
              </div>
            </li>
            <li>
              <button id="stop">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                  <path d="M0 0h24v24H0z" fill="none" />
                  <path fill="#000" d="M6 18V6h12v12z" />
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
