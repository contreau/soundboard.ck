<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Soundboard.CK</title>
    <style>
      @import "98.css";

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background-color: #acacac;
        background: url("/sunset.jpg");

        color: #000000;
        font-family: Arial;
        min-height: 100dvh;
        align-content: center;
      }

      main {
        padding-inline: 1em;
        padding-block: 1em;
        max-width: 450px;
        margin-inline: auto;
      }

      #button-grid {
        display: grid;
        column-gap: 1rem;
        row-gap: 1rem;
        grid-template-columns: 1fr 1fr;
        max-width: fit-content;
        padding-left: 0;
        margin-inline: auto;
        margin-block: 1.5rem;

        li {
          list-style-type: none;
        }

        button {
          min-width: 120px;
          cursor: pointer;
        }
      }

      div.window {
        padding: 2px;
      }

      div.window-body {
        overflow-y: scroll;
      }

      div.title-bar {
        background: linear-gradient(20deg, #ffcd00, #000, #ce1126);
      }

      div.title-bar-text svg {
        display: inline;
        width: 15px;
        height: 15px;
        vertical-align: -3px;
      }

      @media (max-width: 300px) {
        #button-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 500px) {
        body {
          background-position: center;
        }
      }
    </style>

    <script src="src/index.ts" type="module"></script>
  </head>
  <body>
    <main>
      <div class="window">
        <div class="title-bar">
          <div class="title-bar-text">
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M11 22H9v-2H7v-2h2V6H7V4h2V2h2v20Zm8 0h-6v-2h6v2Zm2-2h-2v-2h2v2ZM7 18H5v-2h2v2Zm10 0h-4v-2h4v2Zm6 0h-2V6h2v12ZM5 10H3v4h2v2H1V8h4v2Zm14 6h-2V8h2v8Zm-4-2h-2v-4h2v4ZM7 8H5V6h2v2Zm10 0h-4V6h4v2Zm4-2h-2V4h2v2Zm-2-2h-6V2h6v2Z"
              />
            </svg>
            Soundboard.CK
          </div>
        </div>
        <div class="window-body">
          <ul id="button-grid"></ul>
        </div>
      </div>
    </main>
  </body>
</html>
